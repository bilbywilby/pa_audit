[project]
name = "pa-audit"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
pa-audit = "pa_audit.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
